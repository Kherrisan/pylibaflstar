[package]
name = "libaflstar"
version = "0.1.1"
edition = "2021"
keywords = [
    "testing",
    "security",
    "stateful fuzzing",
    "protocol fuzzing",
    "persistent mode",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
name = "libaflstar"
path = "src/lib.rs"

[profile.dev]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
ciborium = "0.2.2"
clap = { version = "4.4.10", features = ["derive"] }
iceoryx2 = "0.8.1"
env_logger = "0.11.1"
libafl = { path = "../LibAFL/crates/libafl", default-features = true, features = ["prelude"] }
libafl_bolts = { path = "../LibAFL/crates/libafl_bolts", default-features = true, features = ["prelude"] }
log = "0.4.20"
nix = { version = "0.31", features = ["signal", "process", "fs", "poll"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3.17"